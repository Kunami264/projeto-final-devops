name: CI/CD Pipeline

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  prep:
    name: Preparar variáveis do pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_owner_repo: ${{ steps.vars.outputs.image_owner_repo }}
    steps:
      - name: Calcular nome do repositório em minúsculas (requisito do GHCR)
        id: vars
        run: |
          echo "image_owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  security-source:
    name: Segurança — dependências e filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Trivy — scan de dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
        env:
          # os requirements têm sufixo de ambiente (requirements-prd/stg/dev.txt)
          TRIVY_FILE_PATTERNS: 'pip:requirements-.*\.txt'
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  security-images:
    name: Segurança — imagem (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders, web]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Build local para scan
        run: docker build --tag local/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Trivy — scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build (${{ matrix.service }})
    needs: [prep, security-source, security-images]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders, web]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar QEMU para imagens ARM64
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Preparar metadados e tags da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.prep.outputs.image_owner_repo }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-unit:
    name: Testes unitários (${{ matrix.service }})
    needs: build
    if: >-
      github.ref == 'refs/heads/dev' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders]
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Instalar dependências
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Correr testes unitários
        working-directory: ${{ matrix.service }}
        run: python -m pytest tests/ -v

  test-integration:
    name: Testes de integração (pré-deploy STG)
    needs: build
    if: github.ref == 'refs/heads/stg' || github.base_ref == 'stg'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-stg.txt

      - name: Subir o ambiente completo via Docker Compose
        run: docker compose up -d --build

      - name: Esperar que os serviços fiquem saudáveis
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            K=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/health/ready || true)
            U=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/health || true)
            O=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || true)
            if [ "$K" = "200" ] && [ "$U" = "200" ] && [ "$O" = "200" ]; then
              echo "Serviços prontos ao fim de ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout à espera dos serviços"
          docker compose logs
          exit 1

      - name: Instalar dependências de teste (requirements-stg.txt)
        run: pip install -r requirements-stg.txt

      - name: Correr testes de integração
        env:
          USERS_URL: http://localhost:8002
          ORDERS_URL: http://localhost:8001
        run: python -m pytest tests/integration/ -v -m integration

      - name: Logs dos containers (sempre, para diagnóstico)
        if: always()
        run: docker compose logs

      - name: Destruir o ambiente de teste
        if: always()
        run: docker compose down -v --remove-orphans

  deploy-dev:
    name: Deploy DEV (Docker Compose)
    needs: test-unit
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    # só o runner Linux (a VM com MicroK8s); um runner noutro sistema não serve
    runs-on: [self-hosted]
    environment: dev
    timeout-minutes: 10
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # O runner pode ter o Compose como plugin ("docker compose") ou como binário
      # ("docker-compose"), e o plugin instalado só para um utilizador não é visto
      # quando o runner corre como serviço com outro utilizador.
      - name: Detetar o comando do Docker Compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "COMPOSE=docker compose" >> "$GITHUB_ENV"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "COMPOSE=docker-compose" >> "$GITHUB_ENV"
          else
            echo "Docker Compose não encontrado para o utilizador '$(whoami)' (HOME=$HOME) na máquina '$(hostname)'."
            echo "Instalar o plugin para todos os utilizadores: sudo apt-get install docker-compose-plugin"
            exit 1
          fi

      - name: Deploy via Docker Compose
        run: $COMPOSE up -d --build

      - name: Smoke check pós-deploy
        run: |
          set -euo pipefail
          sleep 5
          curl -sf http://localhost:8002/health
          curl -sf http://localhost:8001/health

      - name: Capturar evidência de observabilidade (DEV)
        if: always()
        run: |
          set +e
          echo "## Observabilidade — DEV" >> "$GITHUB_STEP_SUMMARY"

          echo "### Métricas — Prometheus" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:9090/api/v1/query?query=up' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Traces recentes — service-orders (Jaeger)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:16686/api/traces?service=service-orders&limit=5&lookback=1h' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-orders" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          $COMPOSE logs --tail=30 service-orders >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-users" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          $COMPOSE logs --tail=30 service-users >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-stg:
    name: Deploy STG + testes de validação
    needs: test-integration
    if: github.ref == 'refs/heads/stg' && github.event_name == 'push'
    # só o runner Linux (a VM com MicroK8s); um runner noutro sistema não serve
    runs-on: [self-hosted]
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
      - name: Garantir que o MicroK8s está operacional
        run: |
          set -euo pipefail
          if ! microk8s status --wait-ready --timeout 5 >/dev/null 2>&1; then
            echo "MicroK8s não está a responder — a reativar o snap..."
            sudo snap start microk8s || true
            sleep 5
            microk8s start
          fi
          microk8s status --wait-ready --timeout 120

          echo "A confirmar que o API server responde a pedidos reais..."
          for i in $(seq 1 15); do
            if microk8s kubectl get --raw /readyz >/dev/null 2>&1; then
              echo "API server pronto."
              break
            fi
            echo "Ainda não está pronto, a tentar de novo (${i}/15)..."
            sleep 4
          done
      - name: Atualizar credencial GHCR no Kubernetes
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN_STG }}
        run: |
          set -euo pipefail
          test -n "$GHCR_PULL_TOKEN" || {
            echo "GHCR_PULL_TOKEN_STG não está definido no Environment staging."
            exit 1
          }

          microk8s kubectl create namespace staging --dry-run=client -o yaml | microk8s kubectl apply -f -

          microk8s kubectl -n staging create secret docker-registry microk8s-staging-pull \
            --docker-server=ghcr.io \
            --docker-username=kunami264 \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | microk8s kubectl apply -f -

      - name: Preparar acesso ao cluster (KUBECONFIG)
        run: |
          set -euo pipefail
          umask 077
          microk8s config > kubeconfig-stg.yaml
          echo "KUBECONFIG=$PWD/kubeconfig-stg.yaml" >> "$GITHUB_ENV"

      - name: Aplicar Keycloak (namespace auth)
        run: |
          set -euo pipefail
          kubectl apply -f k8s/auth/keycloak.yaml -f k8s/auth/networkpolicy.yaml
          kubectl -n auth rollout status deployment/keycloak --timeout=300s

      - name: Aplicar stack de observabilidade (Prometheus, Jaeger, Grafana)
        run: |
          set -euo pipefail
          kubectl apply \
            -f k8s/observability/jaeger.yaml \
            -f k8s/observability/networkpolicy.yaml \
            -f k8s/observability/prometheus.yaml \
            -f k8s/observability/grafana.yaml

          kubectl create secret generic grafana-admin -n observability \
            --from-literal=GF_SECURITY_ADMIN_USER=admin \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD_STG }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n observability rollout status deployment/prometheus --timeout=90s
          kubectl -n observability rollout status deployment/jaeger --timeout=90s
          kubectl -n observability rollout status deployment/grafana --timeout=90s

      - name: Deploy no Kubernetes via Helm
        run: |
          set -euo pipefail
          umask 077
          kubectl get nodes

          cat > secret-values.yaml <<EOF
          oidc:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET_STG }}"
            requireClientSecret: true
          EOF

          if helm status projeto-final -n staging >/dev/null 2>&1 && \
             ! helm history projeto-final -n staging 2>/dev/null | grep -qw deployed; then
            echo "Release presa de uma tentativa anterior — a remover antes de instalar."
            helm uninstall projeto-final -n staging --wait
          fi

          helm upgrade --install projeto-final ./helm \
            -n staging --create-namespace \
            -f ./helm/values-staging.yaml \
            -f secret-values.yaml \
            --set image.tag="sha-${{ github.sha }}" \
            --wait --timeout 5m

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes de integração + smoke contra STG
        run: make test-stg PYTHON=python KUBECTL="microk8s kubectl"

      - name: Capturar evidência de observabilidade (STG)
        if: always()
        run: |
          set +e
          microk8s config > kubeconfig-stg.yaml
          export KUBECONFIG="$PWD/kubeconfig-stg.yaml"
          PF_PROM=""
          PF_JAEGER=""
          cleanup() { kill "$PF_PROM" "$PF_JAEGER" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "## Observabilidade — STG" >> "$GITHUB_STEP_SUMMARY"
          kubectl port-forward -n observability svc/prometheus 19090:9090 >/dev/null 2>&1 & PF_PROM=$!
          kubectl port-forward -n observability svc/jaeger 17686:16686 >/dev/null 2>&1 & PF_JAEGER=$!
          sleep 5

          echo "### Métricas — Prometheus" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:19090/api/v1/query?query=up' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Traces recentes — service-orders (Jaeger)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:17686/api/traces?service=service-orders&limit=5&lookback=1h' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-orders" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl logs -n staging -l app=service-orders --tail=30 --since=5m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-users" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl logs -n staging -l app=service-users --tail=30 --since=5m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


      - name: Remover ficheiros sensíveis do disco do runner
        if: always()
        run: |
          set -euo pipefail
          shred -u kubeconfig-stg.yaml secret-values.yaml 2>/dev/null || \
            rm -f kubeconfig-stg.yaml secret-values.yaml
  promote:
    name: Promover imagem STG → PRD (${{ matrix.service }})
    needs: [prep, security-source, security-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders, web]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Re-tag da imagem validada em STG (sem novo build)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.prep.outputs.image_owner_repo }}/${{ matrix.service }}"
          docker buildx imagetools create \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:sha-${{ github.sha }}" \
            "$IMAGE:stg"

  deploy-prd:
    name: 🔒 Deploy PRD (Helm + Ingress HTTPS, com aprovação manual)
    needs: promote
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 20
    env:
      PRD_HOST: ${{ vars.PRD_HOST || 'projeto-final.test' }}
    concurrency:
      group: deploy-prd
      cancel-in-progress: false
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
      - name: Atualizar credencial GHCR no Kubernetes
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN_PRD }}
        run: |
          set -euo pipefail
          test -n "$GHCR_PULL_TOKEN" || {
            echo "GHCR_PULL_TOKEN_PRD não está definido no Environment production."
            exit 1
          }
          microk8s status --wait-ready --timeout 120
          microk8s kubectl create namespace production --dry-run=client -o yaml | microk8s kubectl apply -f -

          microk8s kubectl -n production create secret docker-registry microk8s-production-pull \
            --docker-server=ghcr.io \
            --docker-username=kunami264 \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | microk8s kubectl apply -f -

      - name: Preparar acesso ao cluster (KUBECONFIG)
        run: |
          set -euo pipefail
          umask 077
          microk8s config > kubeconfig-prd.yaml
          echo "KUBECONFIG=$PWD/kubeconfig-prd.yaml" >> "$GITHUB_ENV"

      - name: Aplicar Keycloak (namespace auth)
        run: |
          set -euo pipefail
          kubectl apply -f k8s/auth/keycloak.yaml -f k8s/auth/networkpolicy.yaml
          kubectl -n auth rollout status deployment/keycloak --timeout=300s

      - name: Aplicar stack de observabilidade (Prometheus, Jaeger, Grafana)
        run: |
          set -euo pipefail
          kubectl apply \
            -f k8s/observability/jaeger.yaml \
            -f k8s/observability/networkpolicy.yaml \
            -f k8s/observability/prometheus.yaml \
            -f k8s/observability/grafana.yaml

          kubectl create secret generic grafana-admin -n observability \
            --from-literal=GF_SECURITY_ADMIN_USER=admin \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD_PRD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n observability rollout status deployment/prometheus --timeout=90s
          kubectl -n observability rollout status deployment/jaeger --timeout=90s
          kubectl -n observability rollout status deployment/grafana --timeout=90s

      - name: Ponto de entrada HTTPS (Ingress controller + certificado TLS)
        run: |
          set -euo pipefail
          microk8s enable ingress
          make tls-prd PRD_HOST="$PRD_HOST" KUBECTL="microk8s kubectl"
          sed -e "s/__PRD_HOST__/$PRD_HOST/g" -e "s/__INGRESS_CLASS__/public/g" \
            k8s/ingress/keycloak-token-prd.yaml | kubectl apply -f -

      - name: Deploy no Kubernetes via Helm (namespace production)
        run: |
          set -euo pipefail
          umask 077
          kubectl get nodes

          cat > secret-values.yaml <<EOF
          oidc:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET_PRD }}"
            requireClientSecret: true
          EOF

          if helm status projeto-final -n production >/dev/null 2>&1 && \
             ! helm history projeto-final -n production 2>/dev/null | grep -qw deployed; then
            echo "Release presa de uma tentativa anterior — a remover antes de instalar."
            helm uninstall projeto-final -n production --wait
          fi

          helm upgrade --install projeto-final ./helm \
            -n production --create-namespace \
            -f ./helm/values-production.yaml \
            -f secret-values.yaml \
            --set image.tag="sha-${{ github.sha }}" \
            --set ingress.host="$PRD_HOST" \
            --wait --timeout 5m

      - name: Health-check dos workloads (readiness do Kubernetes)
        run: |
          set -euo pipefail
          kubectl -n production rollout status deployment/service-users --timeout=120s
          kubectl -n production rollout status deployment/service-orders --timeout=120s
          kubectl -n production get deploy,pods,hpa,pdb,ingress

      - name: Capturar evidência de observabilidade (PRD)
        if: always()
        run: |
          set +e
          microk8s config > kubeconfig-prd.yaml
          export KUBECONFIG="$PWD/kubeconfig-prd.yaml"
          PF_PROM=""
          PF_JAEGER=""
          cleanup() { kill "$PF_PROM" "$PF_JAEGER" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "## Observabilidade — PRD" >> "$GITHUB_STEP_SUMMARY"
          kubectl port-forward -n observability svc/prometheus 29090:9090 >/dev/null 2>&1 & PF_PROM=$!
          kubectl port-forward -n observability svc/jaeger 27686:16686 >/dev/null 2>&1 & PF_JAEGER=$!
          sleep 5

          echo "### Métricas — Prometheus" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:29090/api/v1/query?query=up' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Traces recentes — service-orders (Jaeger)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS 'http://localhost:27686/api/traces?service=service-orders&limit=5&lookback=1h' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-orders" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl logs -n production -l app=service-orders --tail=30 --since=5m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Logs recentes — service-users" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl logs -n production -l app=service-users --tail=30 --since=5m >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


      - name: Remover ficheiros sensíveis do disco do runner
        if: always()
        run: |
          set -euo pipefail
          shred -u kubeconfig-prd.yaml secret-values.yaml 2>/dev/null || \
            rm -f kubeconfig-prd.yaml secret-values.yaml
