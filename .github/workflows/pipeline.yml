name: CI/CD Pipeline

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prep:
    name: Preparar variáveis do pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_owner_repo: ${{ steps.vars.outputs.image_owner_repo }}
    steps:
      - name: Calcular nome do repositório em minúsculas (requisito do GHCR)
        id: vars
        run: |
          echo "image_owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  security-source:
    name: Segurança — dependências e filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Trivy — scan de dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  security-images:
    name: Segurança — imagem (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build local para scan
        run: docker build --tag local/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Trivy — scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build (${{ matrix.service }})
    needs: [prep, security-source, security-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Preparar metadados e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_owner_repo }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-unit:
    name: Testes unitários (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [service-users, service-orders]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Instalar dependências
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Correr testes unitários
        working-directory: ${{ matrix.service }}
        run: python -m pytest tests/ -v

  test-integration:
    name: Testes de integração (STG/PRD)
    needs: build
    if: >-
      github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/main' ||
      github.base_ref == 'stg' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Subir os dois microsserviços + Jaeger via Docker Compose
        run: docker compose up -d --build

      - name: Esperar que os serviços fiquem saudáveis (máx. 3min — Keycloak demora a arrancar)
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            K=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/health/ready || true)
            U=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/health || true)
            O=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || true)
            if [ "$K" = "200" ] && [ "$U" = "200" ] && [ "$O" = "200" ]; then
              echo "Serviços prontos ao fim de ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout à espera dos serviços"
          docker compose logs
          exit 1

      - name: Instalar dependências de teste
        run: pip install -r requirements.txt

      - name: Correr testes de integração
        env:
          USERS_URL: http://localhost:8002
          ORDERS_URL: http://localhost:8001
        run: python -m pytest tests/integration/ -v -m integration

      - name: Logs dos containers (sempre, para diagnóstico)
        if: always()
        run: docker compose logs

      - name: Destruir o ambiente de teste
        if: always()
        run: docker compose down -v --remove-orphans

  deploy-dev:
    name: Deploy DEV (Docker Compose)
    needs: test-unit
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 10
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        run: docker compose up -d --build

      - name: Smoke check pós-deploy
        run: |
          set -euo pipefail
          sleep 5
          curl -sf http://localhost:8002/health
          curl -sf http://localhost:8001/health

  deploy-stg:
    name: Deploy STG (Helm)
    needs: test-integration
    if: github.ref == 'refs/heads/stg' && github.event_name == 'push'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy no Kubernetes via Helm (namespace staging)
        run: |
          set -euo pipefail
          umask 077

          echo "${{ secrets.KUBE_CONFIG_STG }}" | base64 -d > kubeconfig-stg.yaml
          export KUBECONFIG="$(pwd)/kubeconfig-stg.yaml"

          cat > secret-values.yaml <<EOF
          oidc:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET_STG }}"
            requireClientSecret: true
          EOF

          helm upgrade --install projeto-final ./helm \
            -n staging --create-namespace \
            -f ./helm/values-staging.yaml \
            -f secret-values.yaml \
            --set image.tag="${{ github.sha }}" \
            --atomic \
            --wait --timeout 3m

      - name: Remover ficheiros sensíveis do disco do runner
        if: always()
        run: |
          set -euo pipefail
          shred -u kubeconfig-stg.yaml secret-values.yaml 2>/dev/null || \
            rm -f kubeconfig-stg.yaml secret-values.yaml

  deploy-prd:
    name: 🔒 Deploy PRD (Helm, com aprovação manual)
    needs: test-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-prd
      cancel-in-progress: false
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy no Kubernetes via Helm (namespace production)
        run: |
          set -euo pipefail
          umask 077

          echo "${{ secrets.KUBE_CONFIG_PRD }}" | base64 -d > kubeconfig-prd.yaml
          export KUBECONFIG="$(pwd)/kubeconfig-prd.yaml"

          cat > secret-values.yaml <<EOF
          oidc:
            clientSecret: "${{ secrets.OIDC_CLIENT_SECRET_PRD }}"
            requireClientSecret: true
          EOF

          helm upgrade --install projeto-final ./helm \
            -n production --create-namespace \
            -f ./helm/values-production.yaml \
            -f secret-values.yaml \
            --set image.tag="${{ github.sha }}" \
            --atomic \
            --wait --timeout 3m

      - name: Remover ficheiros sensíveis do disco do runner
        if: always()
        run: |
          set -euo pipefail
          shred -u kubeconfig-prd.yaml secret-values.yaml 2>/dev/null || \
            rm -f kubeconfig-prd.yaml secret-values.yaml

  smoke-prd:
    name: Smoke tests (PRD)
    needs: deploy-prd
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Correr smoke tests contra produção
        env:
          USERS_URL: ${{ secrets.PRD_USERS_URL }}
          ORDERS_URL: ${{ secrets.PRD_ORDERS_URL }}
        run: python -m pytest tests/smoke/ -v