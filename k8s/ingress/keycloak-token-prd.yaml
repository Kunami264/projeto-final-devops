apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-token
  namespace: auth
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: "__INGRESS_CLASS__"
  tls:
    - hosts:
        - "__PRD_HOST__"
      secretName: projeto-final-tls
  rules:
    - host: "__PRD_HOST__"
      http:
        paths:
          - path: /realms/projeto-final/protocol/openid-connect/token
            pathType: Exact
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
