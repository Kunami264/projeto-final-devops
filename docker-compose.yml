services:
  postgres-orders:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders_dev_password
      - POSTGRES_DB=orders
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    networks:
      app-network:
        ipv4_address: 172.30.10.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  service-users:
    build:
      context: ./service-users
      args:
        INSTALL_TRACING: "true"   # OpenTelemetry só em DEV
    ports:
      - "8002:8002"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - ENABLE_TRACING=true
      - DATABASE_URL=postgresql+psycopg2://orders:orders_dev_password@postgres-orders:5432/orders
      # Autenticação (só DEV: em STG/PRD vêm de um Secret do Kubernetes)
      - AUTH_JWT_SECRET=dev-segredo-jwt-troque-me-com-32-ou-mais-caracteres
      - AUTH_ADMIN_USERNAME=admin
      - AUTH_ADMIN_PASSWORD=admin
    networks:
      app-network:
        ipv4_address: 172.30.10.4
    depends_on:
      postgres-orders:
        condition: service_healthy
      jaeger:
        condition: service_started

  service-orders:
    build:
      context: ./service-orders
      args:
        INSTALL_TRACING: "true"   # OpenTelemetry só em DEV
    ports:
      - "8001:8001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - ENABLE_TRACING=true
      - USERS_SERVICE_URL=http://service-users:8002
      - DATABASE_URL=postgresql+psycopg2://orders:orders_dev_password@postgres-orders:5432/orders
      - AUTH_JWT_SECRET=dev-segredo-jwt-troque-me-com-32-ou-mais-caracteres
    networks:
      app-network:
        ipv4_address: 172.30.10.5
    depends_on:
      service-users:
        condition: service_healthy
      postgres-orders:
        condition: service_healthy
      jaeger:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8000:8080"
    networks:
      app-network:
        ipv4_address: 172.30.10.6
    depends_on:
      service-users:
        condition: service_healthy
      service-orders:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      app-network:
        ipv4_address: 172.30.10.7

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/observability/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      app-network:
        ipv4_address: 172.30.10.8
    depends_on:
      - service-users
      - service-orders

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./k8s/observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./k8s/observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./k8s/observability/grafana-provisioning/dashboard-files:/var/lib/grafana/dashboards:ro
      - ./k8s/observability/grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    networks:
      app-network:
        ipv4_address: 172.30.10.9
    depends_on:
      - prometheus

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["sonar"]
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      # Memória limitada (~1,5 GB no total) para caber numa VM pequena
      - SONAR_SEARCH_JAVAOPTS=-Xms512m -Xmx512m
      - SONAR_WEB_JAVAOPTS=-Xmx384m
      - SONAR_CE_JAVAOPTS=-Xmx384m
    ports:
      - "9500:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      sonar-network:
        ipv4_address: 172.30.20.2

# Sub-redes fixas (plano de endereçamento no HLD): a aplicação e as ferramentas de
# segurança ficam em segmentos separados, sem tráfego entre si.
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  sonar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  postgres-orders-data:
  prometheus-data:
  grafana-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
