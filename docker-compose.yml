services:
  postgres-orders:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders_dev_password
      - POSTGRES_DB=orders
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ( for i in {1..60}; do
            sleep 5
            /opt/keycloak/bin/kcadm.sh config credentials --config /tmp/kcadm.config --server http://localhost:8080 --realm master --user "$$KEYCLOAK_ADMIN" --password "$$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1 &&
            /opt/keycloak/bin/kcadm.sh update realms/master --config /tmp/kcadm.config -s "attributes.frontendUrl=$$KC_HOSTNAME_ADMIN" &&
            break
          done ) &
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://keycloak:8080
      - KC_HOSTNAME_ADMIN=http://localhost:8080
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HEALTH_ENABLED=true
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./k8s/auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - app-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          cat <&3 | grep -m 1 "HTTP/1.1 200"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  service-users:
    build:
      context: ./service-users
      args:
        INSTALL_TRACING: "true"   # OpenTelemetry só em DEV
    ports:
      - "8002:8002"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - ENABLE_TRACING=true
      - DATABASE_URL=postgresql+psycopg2://orders:orders_dev_password@postgres-orders:5432/orders
      - OIDC_ISSUER=http://keycloak:8080/realms/projeto-final
      - OIDC_ALLOWED_CLIENTS=service-orders-local,api-cli,backoffice
    networks:
      - app-network
    depends_on:
      postgres-orders:
        condition: service_healthy
      jaeger:
        condition: service_started
      keycloak:
        condition: service_healthy

  service-orders:
    build:
      context: ./service-orders
      args:
        INSTALL_TRACING: "true"   # OpenTelemetry só em DEV
    ports:
      - "8001:8001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - ENABLE_TRACING=true
      - USERS_SERVICE_URL=http://service-users:8002
      - DATABASE_URL=postgresql+psycopg2://orders:orders_dev_password@postgres-orders:5432/orders
      - OIDC_ISSUER=http://keycloak:8080/realms/projeto-final
      - OIDC_CLIENT_ID=service-orders-local
      - OIDC_CLIENT_SECRET=troque-este-segredo-service-orders-local
      - OIDC_ALLOWED_CLIENTS=api-cli,backoffice
    networks:
      - app-network
    depends_on:
      service-users:
        condition: service_healthy
      postgres-orders:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8000:8080"
    networks:
      - app-network
    depends_on:
      service-users:
        condition: service_healthy
      service-orders:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/observability/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network
    depends_on:
      - service-users
      - service-orders

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./k8s/observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./k8s/observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./k8s/observability/grafana-provisioning/dashboard-files:/var/lib/grafana/dashboards:ro
      - ./k8s/observability/grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    networks:
      - app-network
    depends_on:
      - prometheus

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["sonar"]
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      # Memória limitada (~1,5 GB no total) para caber numa VM pequena
      - SONAR_SEARCH_JAVAOPTS=-Xms512m -Xmx512m
      - SONAR_WEB_JAVAOPTS=-Xmx384m
      - SONAR_CE_JAVAOPTS=-Xmx384m
    ports:
      - "9500:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - sonar-network

# Sub-redes fixas (plano de endereçamento no HLD): a aplicação e as ferramentas de
# segurança ficam em segmentos separados, sem tráfego entre si.
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  sonar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  postgres-orders-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
