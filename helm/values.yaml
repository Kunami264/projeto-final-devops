environment: staging

image:
  registry: ghcr.io
  repository: kunami264/projeto-final-devops
  tag: stg
  pullSecretName: microk8s-staging-pull

serviceUsers:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

serviceOrders:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  service:
    type: ClusterIP
    nodePort: null
  retries: 2
  timeoutSeconds: 5

web:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: false
  className: public
  controllerNamespace: ingress
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: projeto-final-tls
    certManager:
      enabled: false
      clusterIssuer: ""

postgres:
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  credentials:
    user: orders
    database: orders
    password: "troque-esta-password"

# Recolha de métricas pelo Prometheus (namespace observability). Desligada em PRD.
observability:
  enableMetrics: true

# Autenticação: o service-users emite tokens JWT (HS256) que as duas APIs validam com o mesmo
# segredo. Os valores reais de cada ambiente estão em values-staging.yaml e values-production.yaml.
auth:
  adminUsername: admin
  adminPassword: ""
  jwtSecret: ""
  tokenTtlSeconds: 1800

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
