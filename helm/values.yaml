environment: staging

image:
  registry: ghcr.io
  repository: kunami264/projeto-final-devops
  tag: stg
  pullSecretName: microk8s-staging-pull

serviceUsers:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

serviceOrders:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  service:
    type: ClusterIP
    nodePort: null
  retries: 2
  timeoutSeconds: 5

web:
  replicas: 1
  keycloakUrl: "http://keycloak.auth.svc.cluster.local:8080"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: false
  # IngressClass do addon "ingress" do MicroK8s.
  className: public
  # Namespace do ingress controller (para a NetworkPolicy do service-users).
  controllerNamespace: ingress
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: projeto-final-tls
    certManager:
      enabled: false
      clusterIssuer: ""

postgres:
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  credentials:
    user: orders
    database: orders
    password: "troque-esta-password"

observability:
  enableTracing: true
  enableMetrics: true

oidc:
  issuer: "http://keycloak.auth.svc.cluster.local:8080/realms/projeto-final"
  clientId: "service-orders-staging"
  clientSecret: ""
  requireClientSecret: false
  allowedClientsForUsers: "service-orders-staging,api-cli,backoffice"
  allowedClientsForOrders: "api-cli,backoffice"

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
