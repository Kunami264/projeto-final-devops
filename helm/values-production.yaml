environment: production

image:
  registry: ghcr.io
  repository: kunami264/projeto-final-devops
  tag: main
  pullSecretName: microk8s-production-pull

serviceUsers:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

web:
  replicas: 2

serviceOrders:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8

ingress:
  enabled: true
  className: public
  host: projeto-final.test
  tls:
    enabled: true
    secretName: projeto-final-tls

oidc:
  issuer: "http://keycloak.auth.svc.cluster.local:8080/realms/projeto-final"
  clientId: "service-orders-production"
  clientSecret: "troque-este-segredo-service-orders-production" 
  allowedClientsForUsers: "service-orders-production,api-cli,backoffice"
  allowedClientsForOrders: "api-cli,backoffice"

postgres:
  storage: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  credentials:
    password: "producao-troque-esta-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1
