environment: production

image:
  registry: ghcr.io
  repository: kunami264/projeto-final-devops
  tag: main
  pullSecretName: microk8s-production-pull

# Uma réplica por serviço (cabe numa VM pequena); o HPA acrescenta réplicas, até 3, se a carga subir.
serviceUsers:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

web:
  replicas: 1

serviceOrders:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

ingress:
  enabled: true
  className: public
  host: projeto-final.test
  tls:
    enabled: true
    secretName: projeto-final-tls

auth:
  adminPassword: "admin"
  jwtSecret: "producao-segredo-jwt-troque-me-com-32-ou-mais-caracteres"

postgres:
  storage: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  credentials:
    password: "producao-troque-esta-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Sem observabilidade em PRD: o Prometheus não recolhe métricas de production
# (monitorização só em DEV e STG).
observability:
  enableMetrics: false
