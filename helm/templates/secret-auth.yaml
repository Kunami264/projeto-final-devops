apiVersion: v1
kind: Secret
metadata:
  name: api-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projeto-final.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- else if .Values.oidc.requireClientSecret }}
  {{- fail "oidc.clientSecret é obrigatório quando oidc.requireClientSecret=true — copia-o do client 'service-orders' no realm do Keycloak (k8s/auth/realm-export.json ou a UI de administração)." }}
  {{- else }}
  OIDC_CLIENT_SECRET: ""
  {{- end }}
