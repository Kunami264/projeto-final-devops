apiVersion: v1
kind: Secret
metadata:
  name: api-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projeto-final.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if lt (len .Values.auth.jwtSecret) 32 }}
  {{- fail "auth.jwtSecret tem de ter pelo menos 32 caracteres" }}
  {{- end }}
  {{- if not .Values.auth.adminPassword }}
  {{- fail "auth.adminPassword é obrigatório" }}
  {{- end }}
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  AUTH_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
