apiVersion: v1
kind: Secret
metadata:
  name: postgres-orders-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projeto-final.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.database | quote }}
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgres.credentials.user }}:{{ .Values.postgres.credentials.password }}@postgres-orders:5432/{{ .Values.postgres.credentials.database }}"
